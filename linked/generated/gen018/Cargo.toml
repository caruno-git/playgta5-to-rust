[package]
name = "gen018"
version = "0.1.0"
edition = "2021"
description = "GTA5 wasm -> Rust machine translation, functions 73813..77908"

[dependencies]
wasm-rt = { path = "../../../wasm-rt" }
wasm-imp = { package = "engine-imports", path = "../../imports" }

[lib]
path = "src/lib.rs"

# standalone: not a member of ../../Cargo.toml (the hand-written
# reconstruction workspace); it must NOT declare its own [workspace],
# or cargo refuses to use it as a path dependency (multiple roots).
